services:
  - type: web
    name: jagasewa-qris-engine
    runtime: go
    plan: free
    region: singapore
    rootDir: services/qris-engine
    buildCommand: go build -o server ./cmd/server
    startCommand: ./server
    envVars:
      - key: QRIS_SECRET_KEY
        generateValue: true
      - key: QRIS_WEBHOOK_SECRET
        generateValue: true
      - key: GATEWAY_PROVIDER
        value: simulator
      - key: LARAVEL_WEBHOOK_URL
        value: https://your-domain.com/api/webhooks/qris-settled
